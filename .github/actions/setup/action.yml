name: Set up SurfaceOne
description: >-
  Node from .nvmrc with the npm cache, `npm ci` (whose prepare script runs `npm run generate`
  once), the node_modules/.cache restore, then SONE_SKIP_GENERATE=1 so no later step of the job
  runs a generator again. Run actions/checkout first.

inputs:
  registry-url:
    description: The npm registry to authenticate against (publishing only).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm
        registry-url: ${{ inputs.registry-url }}

    # prepare → npm run generate: the API, changelog, templates, MCP data, skill references
    # and the Vue / React generated files, once per job.
    - name: Install dependencies (and generate)
      shell: bash
      run: npm ci

    - name: Tool caches (node_modules/.cache)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.cache
        key: node-modules-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
        restore-keys: |
          node-modules-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

    - name: Generate only once
      shell: bash
      run: echo "SONE_SKIP_GENERATE=1" >> "$GITHUB_ENV"
