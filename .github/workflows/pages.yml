name: Deploy docs to Pages

# Deploys the site that a green CI run on main built and tested (its `site` artifact):
# nothing is rebuilt here, and CI runs once per push. Run it by hand to redeploy the
# latest green build of main.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy docs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Find the CI run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --event push --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful CI run on main to deploy."
            exit 1
          fi
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download the site built by CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist/docs/browser
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/docs/browser

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
