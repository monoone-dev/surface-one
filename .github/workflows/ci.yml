name: CI

# One run per push to main or pull request; the jobs run in parallel. Each job installs once
# (`npm ci` runs `npm run generate` through prepare) and then sets SONE_SKIP_GENERATE=1, so no
# test, type-check or build step regenerates. A green run on main hands its `site` artifact to
# pages.yml, which deploys it without rebuilding. release.yml calls this workflow before a publish.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: npx --no-install validate-branch-name -t "$BRANCH"

      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE" --to "$HEAD"

      - name: PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx --no-install commitlint

  lint:
    name: lint, format, generated files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up (install, generate)
        uses: ./.github/actions/setup

      - name: Generated files are committed
        run: |
          paths=(
            apps/docs/src/app/catalog/api.generated.json
            apps/docs/src/app/catalog/tokens.generated.json
            ':(glob)packages/skills/skills/*/references/*.md'
          )
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            git status --short -- "${paths[@]}"
            git --no-pager diff --stat -- "${paths[@]}"
            echo "::error::Generated files are out of date: run npm run generate and commit the result."
            exit 1
          fi

      - name: Formatting (prettier)
        run: npm run format:check

      - name: Style lint (design-token rules)
        run: npm run lint:styles

      - name: Code lint (eslint)
        run: npm run lint

      - name: Shared stylelint config fixtures
        run: npm run test:stylelint-config

  vue:
    name: vue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up (install, generate)
        uses: ./.github/actions/setup

      - name: Type-check
        run: npm run typecheck:vue

      - name: SSR + behaviour
        run: npm run test:vue

  react:
    name: react
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up (install, generate)
        uses: ./.github/actions/setup

      - name: Type-check
        run: npm run typecheck:react

      - name: SSR + behaviour
        run: npm run test:react

  react-native:
    name: react native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up (install, generate)
        uses: ./.github/actions/setup

      - name: Type-check
        run: npm run typecheck:react-native

      - name: Behaviour (react-native-web)
        run: npm run test:react-native

  mcp:
    name: mcp, core, angular helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up (install, generate)
        uses: ./.github/actions/setup

      - name: MCP server (stdio end-to-end)
        run: npm run test:mcp

      - name: Graph layout (plain Node, perf budgets)
        run: npm run test:graph-layout

      - name: Angular helpers (plain Node)
        run: npm run test:angular

      - name: Angular components (Vitest, jsdom, zoneless)
        run: npm run test:angular-components

      - name: Private core package (type-check + tests)
        run: npm run typecheck:core && npm run test:core

  site:
    name: site, a11y
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up (install, generate)
        uses: ./.github/actions/setup

      - name: Angular build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .angular/cache
          key: angular-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            angular-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # No separate `npm run typecheck`: ng build docs type-checks the same program (every
      # apps/docs/src/**/*.ts, strict templates, unreferenced files included) before it bundles.
      - name: Build tokens, library, Vue, React, React Native, docs and Storybook
        run: npm run build:site

      - name: Playwright browsers cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Accessibility (axe-core, light and dark)
        run: npm run test:a11y

      - name: Upload site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: dist/docs/browser
          retention-days: 7
