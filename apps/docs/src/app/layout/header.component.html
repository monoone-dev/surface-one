<header class="site-header">
  <div class="site-header-inner">
    <a
      class="brand"
      [routerLink]="i18n.link('/')"
      [attr.aria-label]="site.name + ' — ' + i18n.m().nav.home"
    >
      <sone-logo size="sm" kind="mark" />
      <span class="brand-name">{{ site.name }}</span>
      <span soneBadge variant="outline" class="brand-version"
        >v{{ site.version }}</span
      >
    </a>

    <nav
      class="primary-nav"
      id="primary-nav"
      [class.is-open]="menuOpen()"
      [attr.aria-label]="i18n.m().a11y.mainNav"
    >
      <ul>
        @for (item of nav; track item.key) {
          <li>
            <a
              [routerLink]="i18n.link(item.path)"
              [attr.aria-current]="isActive(item.path) ? 'page' : null"
              >{{ i18n.m().nav[item.key] }}</a
            >
          </li>
        }
        <li class="nav-external">
          <a [href]="storybook">{{ i18n.m().nav.storybook }}</a>
        </li>
      </ul>
    </nav>

    <div class="header-tools">
      <a
        soneBtn
        variant="ghost"
        size="sm"
        class="storybook-link"
        [href]="storybook"
      >
        {{ i18n.m().nav.storybook }}
      </a>
      <docs-language-menu />
      <docs-color-mode />
      <a
        soneBtn
        variant="ghost"
        size="icon-sm"
        [href]="site.repository"
        target="_blank"
        rel="noopener"
        [attr.aria-label]="
          i18n.m().nav.github + ' ' + i18n.m().a11y.externalLink
        "
      >
        <svg
          viewBox="0 0 16 16"
          width="16"
          height="16"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M8 .2a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.72-.5.06-.49.06-.49.8.06 1.22.82 1.22.82.72 1.22 1.88.87 2.33.66.07-.52.28-.87.5-1.07-1.77-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 .2Z"
          />
        </svg>
      </a>
      <button
        soneBtn
        type="button"
        variant="ghost"
        size="icon-sm"
        class="menu-toggle"
        aria-controls="primary-nav"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="
          menuOpen() ? i18n.m().a11y.closeMenu : i18n.m().a11y.openMenu
        "
        (click)="menuOpen.set(!menuOpen())"
      >
        <sone-icon [icon]="menuOpen() ? 'close' : 'sidebar'" size="sm" />
      </button>
    </div>
  </div>
</header>
