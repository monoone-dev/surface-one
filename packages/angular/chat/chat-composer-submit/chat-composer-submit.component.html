<button
  soneBtn
  size="icon-sm"
  type="submit"
  [disabled]="disabled()"
  [attr.aria-label]="submitLabel()"
>
  @if (pending()) {
    <sone-spinner [size]="16" [label]="null" />
  } @else {
    <svg
      data-slot="chat-send-arrow"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
    >
      <path d="M4 12L20 4l-4 16-4-7-8-1z" fill="currentColor" />
    </svg>
  }
</button>
