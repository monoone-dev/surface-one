<div class="floating-bar">
  <div class="floating-bar-content">
    <ng-content />
  </div>
  <button
    soneBtn
    variant="ghost"
    size="icon-xs"
    type="button"
    class="floating-bar-close"
    data-slot="floating-bar-close"
    [attr.aria-label]="closeLabel()"
    [soneTooltip]="closeLabel()"
    (click)="closed.emit()"
  >
    <sone-icon icon="close" />
  </button>
</div>
