<div soneInputGroup [invalid]="invalid()" [disabled]="isDisabled()">
  <input
    #field
    soneInputGroupInput
    spellcheck="false"
    autocapitalize="off"
    [type]="visible() ? 'text' : 'password'"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [readOnly]="readonly()"
    [attr.id]="inputId()"
    [attr.name]="name()"
    [attr.autocomplete]="autocomplete()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-describedby]="ariaDescribedby()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
  <span soneInputGroupAddon align="inline-end">
    <button
      soneBtn
      variant="ghost"
      size="icon-xs"
      type="button"
      data-slot="password-input-toggle"
      [disabled]="isDisabled()"
      [attr.aria-pressed]="visible()"
      [attr.aria-label]="toggleLabel()"
      [attr.title]="toggleLabel()"
      (click)="toggle()"
    >
      @if (visible()) {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M1.8 12S6 4.8 12 4.8 22.2 12 22.2 12 18 19.2 12 19.2 1.8 12 1.8 12z"
          />
          <circle cx="12" cy="12" r="3.1" />
          <path d="M3.5 3.5l17 17" />
        </svg>
      } @else {
        <sone-icon icon="eye" />
      }
    </button>
  </span>
</div>
