<button
  soneToggle
  variant="outline"
  type="button"
  class="mic"
  [pressed]="muted()"
  [class.is-muted]="muted()"
  [class.is-compact]="compact()"
  [disabled]="disabled()"
  [attr.aria-label]="muted() ? unmuteLabel() : muteLabel()"
  [title]="muted() ? unmuteLabel() : muteLabel()"
  (click)="muteToggle.emit()"
>
  @if (muted()) {
    <svg
      class="mic-ico"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="M9 9V5a3 3 0 0 1 5.12-2.12M15 9.34V10a3 3 0 0 1-3 3"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M17 11a5 5 0 0 1-.54 2.27M5 11a7 7 0 0 0 7 7m0 0v3m0-3a6.97 6.97 0 0 0 1.6-.18"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M3 3l18 18"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  } @else {
    <svg
      class="mic-ico"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
      focusable="false"
    >
      <rect
        x="9"
        y="2"
        width="6"
        height="12"
        rx="3"
        stroke="currentColor"
        stroke-width="1.9"
      />
      <path
        d="M5 11a7 7 0 0 0 14 0M12 18v3"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  }
  @if (!compact()) {
    <span class="mic-label">
      @if (muted()) {
        <ng-container i18n="Microphone state label">Muted</ng-container>
      } @else {
        <ng-container i18n="verb|Microphone button label">Mute</ng-container>
      }
    </span>
  }
</button>
