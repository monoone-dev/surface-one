<div soneField [invalid]="!!error()">
  @if (hasKey() !== null) {
    <div class="status" data-slot="secret-field-status">
      <span class="text-secondary">{{ label() }}</span>
      @if (hasKey()) {
        <span soneBadge variant="success">
          <span class="badge-dot"></span>
          {{ setLabel() }}
        </span>
      } @else {
        <span soneBadge variant="outline">
          <span class="badge-dot"></span>
          {{ unsetLabel() }}
        </span>
      }
    </div>
  }
  <div soneInputGroup [disabled]="busy()">
    <input
      soneInputGroupInput
      type="password"
      [id]="inputId"
      [value]="draft()"
      [placeholder]="placeholder()"
      [disabled]="busy()"
      [attr.aria-label]="ariaLabel() ?? label()"
      [attr.autocomplete]="autocomplete()"
      spellcheck="false"
      (input)="onInput($event)"
    />
    <span soneInputGroupAddon align="inline-end">
      <button
        soneBtn
        variant="ghost"
        size="xs"
        type="button"
        [disabled]="!canSave()"
        (click)="submit()"
      >
        @if (busy()) {
          <ng-container i18n>Saving…</ng-container>
        } @else {
          {{ saveLabel() }}
        }
      </button>
      @if (clearable() && hasKey()) {
        <button
          soneBtn
          variant="ghost"
          size="xs"
          type="button"
          [disabled]="busy()"
          (click)="onClear()"
          i18n="verb|Button that removes the saved secret"
        >
          Clear
        </button>
      }
    </span>
  </div>
  @if (help(); as h) {
    <p soneFieldDescription>{{ h }}</p>
  }
  @if (error(); as e) {
    <p soneFieldError>{{ e }}</p>
  }
</div>
