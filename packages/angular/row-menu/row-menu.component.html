<!-- Two copies of ONE trigger: `[soneTooltip]` adopts (and removes) the host
     `title` on hover, so a trigger keeping its native `title` must not carry it. -->
@if (tooltip(); as tip) {
  <button
    #trigger
    type="button"
    class="row-menu-trigger"
    data-slot="row-menu-trigger"
    [attr.data-state]="isOpen() ? 'open' : 'closed'"
    [class.is-open]="isOpen()"
    [disabled]="disabled()"
    aria-haspopup="menu"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="panelId"
    [attr.aria-label]="label()"
    [soneTooltip]="tip"
    (click)="onTriggerClick($event)"
    (keydown)="onTriggerKeydown($event)"
  >
    <ng-container [ngTemplateOutlet]="glyph" />
  </button>
} @else {
  <button
    #trigger
    type="button"
    class="row-menu-trigger"
    data-slot="row-menu-trigger"
    [attr.data-state]="isOpen() ? 'open' : 'closed'"
    [class.is-open]="isOpen()"
    [disabled]="disabled()"
    aria-haspopup="menu"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="panelId"
    [attr.aria-label]="label()"
    [title]="label()"
    (click)="onTriggerClick($event)"
    (keydown)="onTriggerKeydown($event)"
  >
    <ng-container [ngTemplateOutlet]="glyph" />
  </button>
}

<ng-template #glyph>
  <ng-content select="[soneRowMenuGlyph]">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="1" />
      <circle cx="19" cy="12" r="1" />
      <circle cx="5" cy="12" r="1" />
    </svg>
  </ng-content>
</ng-template>

@if (isOpen()) {
  <div
    soneMenu
    #panel
    [id]="panelId"
    class="row-menu-panel"
    data-state="open"
    [attr.data-side]="side()"
    [class.is-positioned]="panelPositioned()"
    [style.left.px]="panelLeft()"
    [style.top.px]="panelTop()"
    [style.max-height.px]="panelMaxHeight()"
    soneTeleportToBody
    soneRepositionOnScroll
    [repositionAnchor]="triggerEl()"
    (reposition)="onViewportChange()"
    role="menu"
    tabindex="-1"
    [attr.aria-label]="tooltip() ?? label()"
    (click)="onPanelClick($event)"
    (keydown)="onPanelKeydown($event)"
  >
    <ng-content />
  </div>
}
