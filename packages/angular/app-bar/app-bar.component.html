<header class="app-bar" data-slot="app-bar-header">
  @if (backHref(); as href) {
    <a
      soneBtn
      variant="ghost"
      size="icon"
      class="app-bar-back"
      data-slot="app-bar-back"
      [href]="href"
      [attr.aria-label]="backLabel()"
    >
      <sone-icon icon="arrow-left" />
    </a>
  } @else if (showBack()) {
    <button
      soneBtn
      variant="ghost"
      size="icon"
      type="button"
      class="app-bar-back"
      data-slot="app-bar-back"
      [attr.aria-label]="backLabel()"
      (click)="back.emit()"
    >
      <sone-icon icon="arrow-left" />
    </button>
  }
  <div class="app-bar-heading" data-slot="app-bar-heading">
    @switch (level()) {
      @case (2) {
        <h2 class="app-bar-title" data-slot="app-bar-title">{{ title() }}</h2>
      }
      @case (3) {
        <h3 class="app-bar-title" data-slot="app-bar-title">{{ title() }}</h3>
      }
      @case (4) {
        <h4 class="app-bar-title" data-slot="app-bar-title">{{ title() }}</h4>
      }
      @case (5) {
        <h5 class="app-bar-title" data-slot="app-bar-title">{{ title() }}</h5>
      }
      @case (6) {
        <h6 class="app-bar-title" data-slot="app-bar-title">{{ title() }}</h6>
      }
      @default {
        <h1 class="app-bar-title" data-slot="app-bar-title">{{ title() }}</h1>
      }
    }
    @if (subtitle(); as text) {
      <p class="app-bar-subtitle" data-slot="app-bar-subtitle">{{ text }}</p>
    }
  </div>
  <div class="app-bar-trailing">
    <ng-content select="[soneAppBarTrailing]" />
  </div>
</header>
