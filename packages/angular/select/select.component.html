<select
  #select
  data-slot="native-select"
  [value]="current()"
  [disabled]="isDisabled()"
  [attr.id]="selectId()"
  [attr.name]="name()"
  [attr.data-size]="size()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-describedby]="ariaDescribedby()"
  (change)="onChangeEvent($event)"
>
  <ng-content />
</select>
