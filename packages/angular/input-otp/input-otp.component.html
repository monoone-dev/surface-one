<input
  #field
  class="otp-input"
  data-slot="input-otp-input"
  type="text"
  autocomplete="one-time-code"
  spellcheck="false"
  autocapitalize="off"
  [value]="value()"
  [disabled]="isDisabled()"
  [attr.id]="inputId()"
  [attr.name]="name()"
  [attr.maxlength]="size()"
  [attr.inputmode]="inputMode()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-describedby]="ariaDescribedby()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  (input)="onInput($event)"
  (focus)="onFocus()"
  (blur)="onBlur()"
  (click)="caretToEnd()"
  (select)="caretToEnd()"
  (keyup)="caretToEnd()"
/>
<div class="otp-slots" aria-hidden="true">
  @for (group of layout(); track $index; let last = $last) {
    <div class="otp-group" data-slot="input-otp-group">
      @for (slot of group; track slot) {
        <div
          class="otp-slot"
          data-slot="input-otp-slot"
          [attr.data-active]="focused() && slot === activeIndex() ? '' : null"
          [attr.data-filled]="chars()[slot] ? '' : null"
        >
          {{ chars()[slot] ?? "" }}
          @if (focused() && slot === activeIndex() && !chars()[slot]) {
            <span class="otp-caret"></span>
          }
        </div>
      }
    </div>
    @if (!last) {
      <div class="otp-separator" data-slot="input-otp-separator">
        <svg viewBox="0 0 16 16" fill="none">
          <path
            d="M4 8h8"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </div>
    }
  }
</div>
